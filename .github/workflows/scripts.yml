# Runs the scripts' tests (GameScript/Tests) and the battle server's (BattleServer/Tests) on every push
# and pull request, so they never drift from the code; the battle server's that need the game skip. Windows, since Multiplayer.rb builds its paths with backslashes as the game needs.
name: Scripts

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Test the scripts
        run: ruby GameScript/Tests/run.rb

      - name: Test the battle server
        run: ruby BattleServer/Tests/run.rb
