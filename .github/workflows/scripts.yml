# Runs the scripts' tests (GameScript/Tests) and the battle server's (BattleServer/Tests) on every push
# and pull request, so they never drift from the code; the battle server's that need the game skip. Windows, since Multiplayer.rb builds its paths with backslashes as the game needs.
name: Scripts

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # The scripts' tests load the Mod Framework's scripts, from the framework release named by
      # MOD_FRAMEWORK_REQUIRED in Multiplayer.rb, which players install on their own.
      - name: Fetch the Mod Framework
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content GameScript/Multiplayer.rb -Raw), 'MOD_FRAMEWORK_REQUIRED = "([^"]+)"').Groups[1].Value
          gh release download "v$version" --repo Pauliinchen/MGQ-Mod-Framework --pattern "MGQ-Mod-Framework-$version.zip" --dir $env:RUNNER_TEMP --clobber
          Expand-Archive "$env:RUNNER_TEMP/MGQ-Mod-Framework-$version.zip" -DestinationPath "$env:RUNNER_TEMP/Framework" -Force
          "MGQ_MOD_FRAMEWORK_DIR=$env:RUNNER_TEMP/Framework/Patch/Mod_Framework" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test the scripts
        run: ruby GameScript/Tests/run.rb

      - name: Test the battle server
        run: ruby BattleServer/Tests/run.rb
