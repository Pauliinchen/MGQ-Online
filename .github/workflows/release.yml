# Publishing a release on GitHub (tag e.g. v1.0.0) builds the mod and attaches
# MGQ-Online-<version>.zip to that release, and the battle server's core MGQOnline.ServerCore.so
# beside it, which the battle server deploy takes; the mod zip does not hold it. Nothing to upload
# by hand.
#
# Run it by hand from the Actions tab with a release's tag to build and attach the zip again, for
# example after a failed run. It builds the code at that tag with this workflow from main, so the
# release and its tag stay as they are.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the published release, e.g. v0.1.0
        required: true

permissions:
  contents: write   # needed to attach the zip to the release

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The tests run 32-bit like the game, so they need the x86 runtime next to the x64 SDK. A
      # failing test ends the job here, before a zip is built.
      - name: Install the x86 .NET runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -Channel 10.0 -Runtime dotnet -Architecture x86 -InstallDir "${env:ProgramFiles(x86)}\dotnet"

      # setup-dotnet points DOTNET_ROOT at the x64 install, which a 32-bit app would follow and fail
      # to load. DOTNET_ROOT_X86 comes first for a 32-bit app.
      - name: Test
        env:
          DOTNET_ROOT_X86: C:\Program Files (x86)\dotnet
        run: dotnet run --project MGQParadox.Multiplayer.Tests

      - name: Test the bridge
        run: dotnet run --project MGQOnline.Bridge.Tests

      - name: Test the game rules
        run: dotnet run --project MGQOnline.Game.Tests

      - name: Test the battle server core
        run: dotnet run --project MGQOnline.ServerCore.Tests

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Test the scripts
        run: ruby GameScript/Tests/run.rb

      # Mod Config Remake ships with the mod, from the Mod Collection's latest release.
      - name: Fetch Mod Config Remake
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo Pauliinchen/MGQ-Paradox-Mod-Collection --pattern 0_ModConfigRemake.rb --dir package/Patch --clobber

      # The runner's Visual Studio brings the C++ linker NativeAOT needs. The DLL's publish also
      # publishes Helper.exe (NativeAOT win-x86, the update, the restart and the parked mods'
      # watchdog) with the same version into the package.
      - name: Publish (Release publishes also zip the package)
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          dotnet publish MGQParadox.Multiplayer -c Release -p:Version=$version

      - name: Attach zip to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG (Get-ChildItem MGQParadox.Multiplayer/bin/Release/*.zip).FullName --clobber

  # The battle server's core, a linux-x64 NativeAOT library, built in the pinned SDK container as
  # on a developer's PC (MGQOnline.ServerCore/build.ps1), then loaded into sandboxed battle
  # children the way the battle server loads it (BattleServer/tools/core_check.ps1) before it is
  # attached.
  server-core:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Build the battle server core
        shell: pwsh
        run: ./MGQOnline.ServerCore/build.ps1 -Version ($env:TAG.TrimStart("v"))

      - name: Check it in sandboxed battle children
        shell: pwsh
        run: ./BattleServer/tools/core_check.ps1

      - name: Attach the core to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" MGQOnline.ServerCore/bin/linux-x64/MGQOnline.ServerCore.so --clobber
