#----------------------------------------------------------------
#  wrangler.toml
#
#  Changelog:
#      Paulinchen  2026-10-12: Added the lowest game version the relay serves
#                            - Added the bug reports' Durable Object
#      Paulinchen  2026-10-11: Added the repositories and the branch the bug reports go to
#      Paulinchen  2026-10-06: Checked the mod catalog's links every half hour
#      Paulinchen  2026-09-29: Added the world directory's Durable Object
#                            - Added the world rooms' Durable Object
#                            - Created
#
#----------------------------------------------------------------

# The relay's Worker, reachable at relay.mgqmp.workers.dev once deployed.
name = "relay"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# Checks the mod catalog's links for new releases every half hour.
[triggers]
crons = ["*/30 * * * *"]

# Where the bug reports go: a public issue in the issues repository, linking the report's files
# committed to the private files repository's branch. The relay takes reports only once both
# secrets are set (wrangler secret put <name>): GITHUB_ISSUES_TOKEN may write issues in the issues
# repository, GITHUB_BUG_FILES_TOKEN contents in the files repository, and neither more.
[vars]
REPORT_ISSUES_REPO = "Pauliinchen/MGQ-Online"
REPORT_FILES_REPO = "Pauliinchen/MGQ-Online-Bug-Reports"
REPORT_FILES_BRANCH = "main"
# The lowest version a game that names its version in X-MGQ-Version may have; development builds
# always pass, and games before 0.6.0 are turned away whatever it says.
MIN_VERSION = "0.6.0"

# One Durable Object per room and per world room, one for the world directory and one for the bug
# reports, SQLite backed, the only kind the free plan offers. The report object stores nothing.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "WORLDS"
class_name = "World"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[durable_objects.bindings]]
name = "REPORTS"
class_name = "Reports"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["World"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Directory"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Reports"]
